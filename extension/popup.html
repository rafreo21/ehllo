<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ehllo Capture</title>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; margin: 0; min-width: 280px; color: #102018; }
      main { padding: 14px; display: grid; gap: 10px; }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand img { width: 28px; height: 28px; display: block; flex: 0 0 auto; }
      .brand strong { display: block; font-size: 15px; letter-spacing: -.02em; }
      .version { display: block; font-size: 11px; color: #7a8b7f; font-weight: 600; }
      label { display: grid; gap: 4px; font-size: 12px; color: #476457; }
      input { border: 1px solid #c8dcc8; border-radius: 10px; padding: 8px 10px; }
      button { border: 0; border-radius: 999px; padding: 10px 14px; background: #9fe870; color: #102018; font-weight: 700; cursor: pointer; }
      button.secondary { background: white; box-shadow: inset 0 0 0 1px #c8dcc8; }
      button.hidden { display: none; }
      .status { font-size: 12px; color: #476457; min-height: 18px; }
      .preview { font-size: 12px; background: #f4f9f1; border-radius: 12px; padding: 10px; white-space: pre-line; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="icons/aftermeet-logo.svg" alt="" width="28" height="28" />
        <div>
          <strong>Capture to ehllo</strong>
          <small id="version" class="version"></small>
        </div>
      </div>
      <label>
        ehllo URL
        <input id="base-url" type="url" placeholder="https://aftermeet-beta.vercel.app" />
      </label>
      <div id="preview" class="preview">Open a LinkedIn profile, then capture.</div>
      <button id="capture" type="button">Capture this page</button>
      <button id="open-aftermeet" type="button" class="secondary hidden">Open in ehllo</button>
      <button id="reset" type="button" class="secondary">Capture another profile</button>
      <p id="status" class="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
